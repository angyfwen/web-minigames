<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Code Cards</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,400..600;1,400..600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background: #000000;
        }

        body {
            font-size: 1.2rem;
            font-weight: 400;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
            position: relative;
        }

        #bg-container {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-color: #000;
        }

        .bg-layer {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.90); /* Darkened by 10% from 0.80 */
            z-index: 1;
            pointer-events: none;
        }

        .card-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between; 
            min-height: calc(100vh - 80px);
            width: 100%;
            max-width: 600px;
            gap: 20px;
            z-index: 2;
            position: relative;
        }

        .glass-panel {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
            backdrop-filter: blur(12px) saturate(180%) contrast(105%);
            -webkit-backdrop-filter: blur(12px) saturate(180%) contrast(105%);
        }

        .short-card {
            display: block;
            position: relative;
            width: 100%;
            height: 76px; 
            z-index: 10;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2);
        }

        .profile-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px; 
            width: 100%;
            height: 100%;
            font-family: 'Quicksand', sans-serif;
            position: relative;
            z-index: 10;
        }

        .profile-left {
            display: flex;
            align-items: center;
            gap: 16px; 
        }

        .pfp {
            width: 48px;
            height: 48px;
            border-radius: 50%; 
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.15); 
            padding: 2px; 
            flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .profile-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 5px; 
        }

        .title-row {
            display: flex;
            align-items: center;
            gap: 10px; 
        }

        .title-row h1 {
            font-size: 1.15rem; 
            margin: 0;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.3px;
            line-height: 1;
        }

        .glass-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            transition: all 0.2s ease;
            font-weight: 700;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px) saturate(180%);
            -webkit-backdrop-filter: blur(8px) saturate(180%);
            cursor: pointer;
            outline: none;
        }

        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        .github-link {
            gap: 4px;
            font-size: 0.55rem;
            padding: 3px 6px;
            line-height: 1;
            background: rgba(142, 86, 255, 0.12); 
            border: 1px solid rgba(162, 115, 255, 0.3);
            color: rgba(230, 210, 255, 1);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.15);
        }

        .github-link:hover {
            background: rgba(142, 86, 255, 0.25);
        }

        .github-link svg {
            width: 10px;
            height: 10px;
        }

        .btn-music {
            background: rgba(255, 140, 0, 0.12);
            border: 1px solid rgba(255, 170, 50, 0.3);
            color: rgba(255, 200, 100, 1);
        }
        
        .btn-music:hover { background: rgba(255, 140, 0, 0.25); }

        .btn-theme {
            background: rgba(0, 170, 255, 0.12);
            border: 1px solid rgba(50, 200, 255, 0.3);
            color: rgba(150, 220, 255, 1);
        }

        .btn-theme:hover { background: rgba(0, 170, 255, 0.25); }

        .status-text {
            font-size: 0.62rem; 
            margin: 0 0 0 2px; 
            color: rgba(255, 255, 255, 0.65);
            font-weight: 600; 
            letter-spacing: 0.2px;
        }

        .profile-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .action-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%; 
            padding: 0;
            flex-shrink: 0;
        }

        .action-btn svg { width: 14px; height: 14px; }

        .toolbar-row {
            display: flex;
            width: 100%;
            gap: 12px;
            align-items: center;
            z-index: 10;
        }

        .toolbar-btn {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            flex-shrink: 0;
            padding: 0;
            font-size: 1.4rem;
        }

        .toolbar-btn svg {
            width: 18px;
            height: 18px;
            color: rgba(255, 255, 255, 0.7);
        }

        .search-wrapper {
            flex: 1; 
            width: 100%;
            height: 48px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            padding: 0 18px;
            gap: 12px;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2);
        }

        .search-icon {
            color: rgba(255, 255, 255, 0.6);
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-family: 'Quicksand', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .search-input::placeholder { color: rgba(255, 255, 255, 0.4); }

        .folder-system {
            position: relative;
            width: 100%;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .folder-system .unified-glass {
            position: absolute;
            inset: 0;
            mask-image: var(--mask-solid);
            -webkit-mask-image: var(--mask-solid);
            z-index: 0;
        }

        .folder-system .unified-border {
            position: absolute;
            inset: 0;
            background-image: var(--svg-border);
            background-size: 100% 100%;
            background-repeat: no-repeat;
            pointer-events: none;
            z-index: 1;
        }

        .folder-tabs {
            display: flex;
            align-items: flex-end;
            height: 44px; 
            padding: 0 20px;
            gap: 6px;
            position: relative;
            z-index: 10;
        }

        .folder-tab {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.4); 
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            padding: 0 16px;
            height: 36px; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: color 0.3s ease; 
        }

        .folder-tab svg {
            flex-shrink: 0;
            width: 14px; height: 14px;
        }

        .folder-tab.active {
            color: #fff; 
        }

        .folder-tab:hover:not(.active) {
            color: rgba(255, 255, 255, 0.7);
        }

        .tall-card-content {
            width: 100%;
            height: 1000px;
            position: relative;
            z-index: 10;
            padding: 20px;
        }

        @media (max-width: 768px) {
            body { padding: 30px 24px; }
            .card-stack { gap: 16px; }
            .profile-card { padding: 0 16px; }
            .title-row h1 { font-size: 1rem; }
            .status-text { font-size: 0.55rem; }
            .pfp { width: 42px; height: 42px; border-width: 1.5px; padding: 1.5px; }
            .action-btn { width: 30px; height: 30px; }
            .tall-card-content { height: 400px; }
            .folder-tabs { padding: 0 16px; height: 40px; gap: 4px; }
            .folder-tab { padding: 0 12px; height: 32px; font-size: 0.75rem; }
            
            .toolbar-row { gap: 8px; }
            .toolbar-btn { width: 42px; height: 42px; border-radius: 14px; }
            .search-wrapper { height: 42px; border-radius: 14px; padding: 0 14px; }
            .toolbar-btn svg { width: 16px; height: 16px; }
        }
    </style>
</head>
<body>

<div id="bg-container">
    <div class="bg-layer" style="background-image: url('https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExaTk5YWkwbDRoeDl6MHNqc2puY3c0aW9iNWJ0eDhjZjE1N2JkNnF6aiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/WfaHuht7D5SSNfetTf/giphy.gif');"></div>
</div>

<div class="card-stack">
    
    <div class="short-card glass-panel">
        <div class="profile-card">
            <div class="profile-left">
                <img src="https://i.pinimg.com/736x/93/16/4b/93164be31e575e7697e242537393f51a.jpg" alt="angyfwen" class="pfp">
                <div class="profile-info">
                    <div class="title-row">
                        <h1>alis' web minigames</h1>
                        <a href="https://github.com/angyfwen" target="_blank" rel="noopener noreferrer" class="glass-btn github-link" title="github">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
                            </svg> angyfwen

                    </div>
                    <p class="status-text">mostly from internship projects... i guess...</p>

            </div>
            
            <div class="profile-right">
                <button class="glass-btn action-btn btn-music" title="Music">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
                </button>
                <button class="glass-btn action-btn btn-theme" title="Toggle Theme">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>

        </div>
    </div>

    <div class="toolbar-row">
        <button class="glass-btn toolbar-btn bg-trigger" data-bg="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExNnI0OHBoaTg0NzcwaTR6aWdxYXZiODZjd2xwdTlpMHUyZ3h3MXFwayZlcD12MV9pbnRlcm55YWlfnaWZfYnlfaWQmY3Q9Zw/PamI2MtO1DU1a/giphy.gif" title="Drama">🎭</button>
        <button class="glass-btn toolbar-btn bg-trigger" data-bg="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExdG04cXFpYTVmYjNkcGRnMGUyenF1MTF4YzF2OWpudDR4ejNpNzI0MyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/z5kShzBAL5mM/giphy.gif" title="Teddy">🧸</button>
        <button class="glass-btn toolbar-btn bg-trigger" data-bg="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExZnA3c2hzY214Nml4M3ZjbTJ5ZG5jMDl3ODNjbGJhZ211eDF5NGNzdiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/LtVmxCRHQu33a/giphy.gif" title="Smoke">🚬</button>
        <button class="glass-btn toolbar-btn bg-trigger" data-bg="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExaTk5YWkwbDRoeDl6MHNqc2puY3c0aW9iNWJ0eDhjZjE1N2JkNnF6aiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/WfaHuht7D5SSNfetTf/giphy.gif" title="Dango">🍡</button>
        
        <div class="search-wrapper glass-panel">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>

    <div class="folder-system">
        <div class="unified-glass glass-panel"></div>
        <div class="unified-border"></div>
        
        <div class="folder-tabs">
            <button class="folder-tab active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                logs
            </button>
            <button class="folder-tab">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                modules
            </button>
            <button class="folder-tab">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
                saves
            </button>

        <div class="tall-card-content">
            <!-- Content goes here -->
        </div>

</div>

<script>
    const folderSystem = document.querySelector('.folder-system');
    const folderTabs = document.querySelectorAll('.folder-tab');
    let currentBumpParams = null;

    function renderFolderMasks(p, w, h, cY) {
        const R = 16; 
        const rT = 12; 
        
        let maskD = `M 0,${cY + R} `; 
        maskD += `A ${R},${R} 0 0,1 ${R},${cY} `; 
        maskD += `L ${p.x},${cY} `; 
        maskD += `L ${p.x},${p.y + rT} `; 
        maskD += `A ${rT},${rT} 0 0,1 ${p.x + rT},${p.y} `; 
        maskD += `L ${p.x + p.w - rT},${p.y} `; 
        maskD += `A ${rT},${rT} 0 0,1 ${p.x + p.w},${p.y + rT} `; 
        maskD += `L ${p.x + p.w},${cY} `; 
        maskD += `L ${w - R},${cY} `; 
        maskD += `A ${R},${R} 0 0,1 ${w},${cY + R} `; 
        maskD += `L ${w},${h - R} `; 
        maskD += `A ${R},${R} 0 0,1 ${w - R},${h} `; 
        maskD += `L ${R},${h} `; 
        maskD += `A ${R},${R} 0 0,1 0,${h - R} `; 
        maskD += `Z`;
        
        const left = 0.5; 
        const right = w - 0.5; 
        const top = cY + 0.5; 
        const bottom = h - 0.5; 
        const tabY = p.y + 0.5;
        const tabX1 = p.x + 0.5;
        const tabX2 = p.x + p.w - 0.5;

        let borderD = `M ${left},${top + R} `; 
        borderD += `A ${R},${R} 0 0,1 ${left + R},${top} `; 
        borderD += `L ${tabX1},${top} `; 
        borderD += `L ${tabX1},${tabY + rT} `; 
        borderD += `A ${rT},${rT} 0 0,1 ${tabX1 + rT},${tabY} `; 
        borderD += `L ${tabX2 - rT},${tabY} `; 
        borderD += `A ${rT},${rT} 0 0,1 ${tabX2},${tabY + rT} `; 
        borderD += `L ${tabX2},${top} `; 
        borderD += `L ${right - R},${top} `; 
        borderD += `A ${R},${R} 0 0,1 ${right},${top + R} `; 
        borderD += `L ${right},${bottom - R} `; 
        borderD += `A ${R},${R} 0 0,1 ${right - R},${bottom} `; 
        borderD += `L ${left + R},${bottom} `; 
        borderD += `A ${R},${R} 0 0,1 ${left},${bottom - R} `; 
        borderD += `Z`;

        const solidSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><path fill="black" d="${maskD}"/></svg>`;
        
        const clipId = 'clip_' + Math.random().toString(36).substr(2, 9);
        const borderSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}">
            <clipPath id="${clipId}">
                <path d="${maskD}"/>
            </clipPath>
            <path clip-path="url(#${clipId})" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" transform="translate(0, 1)" d="${borderD}"/>
            <path fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" d="${borderD}"/>
        </svg>`;
        
        folderSystem.style.setProperty('--mask-solid', `url('data:image/svg+xml;utf8,${encodeURIComponent(solidSvg)}')`);
        folderSystem.style.setProperty('--svg-border', `url('data:image/svg+xml;utf8,${encodeURIComponent(borderSvg)}')`);
    }

    function updateUnifiedFolder(animate = true) {
        if (!folderSystem) return;
        const activeTab = document.querySelector('.folder-tab.active');
        if (!activeTab) return;
        
        const sysRect = folderSystem.getBoundingClientRect();
        const tabRect = activeTab.getBoundingClientRect();
        const tabsContainerRect = document.querySelector('.folder-tabs').getBoundingClientRect();
        
        const w = sysRect.width;
        const h = sysRect.height;
        const cY = tabsContainerRect.height; 
        
        const targetParams = {
            x: tabRect.left - sysRect.left,
            y: tabRect.top - sysRect.top,
            w: tabRect.width,
            h: tabRect.height
        };
        
        if (!currentBumpParams) {
            currentBumpParams = { ...targetParams };
            renderFolderMasks(currentBumpParams, w, h, cY);
            return;
        }
        
        if (animate) {
            gsap.to(currentBumpParams, {
                x: targetParams.x,
                y: targetParams.y,
                w: targetParams.w,
                h: targetParams.h,
                duration: 0.45,
                ease: "power3.out",
                onUpdate: () => renderFolderMasks(currentBumpParams, w, h, cY)
            });
        } else {
            currentBumpParams = { ...targetParams };
            renderFolderMasks(currentBumpParams, w, h, cY);
        }
    }

    folderTabs.forEach(tab => {
        tab.addEventListener('click', () => {
            if (tab.classList.contains('active')) return;
            folderTabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            updateUnifiedFolder(true); 
        });
    });

    function resizeAll() {
        updateUnifiedFolder(false);
    }
    
    window.addEventListener('resize', resizeAll);
    
    window.addEventListener('load', () => {
        requestAnimationFrame(() => {
            resizeAll();
            setTimeout(resizeAll, 100); 
        });
    });

    const bgContainer = document.getElementById('bg-container');
    const bgTriggers = document.querySelectorAll('.bg-trigger');

    const bgGifs = [
        "https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExNnI0OHBoaTg0NzcwaTR6aWdxYXZiODZjd2xwdTlpMHUyZ3h3MXFwayZlcD12MV9pbnRlcm55YWlfnaWZfYnlfaWQmY3Q9Zw/PamI2MtO1DU1a/giphy.gif",
        "https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExdG04cXFpYTVmYjNkcGRnMGUyenF1MTF4YzF2OWpudDR4ejNpNzI0MyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/z5kShzBAL5mM/giphy.gif",
        "https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExZnA3c2hzY214Nml4M3ZjbTJ5ZG5jMDl3ODNjbGJhZ211eDF5NGNzdiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/LtVmxCRHQu33a/giphy.gif",
        "https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExaTk5YWkwbDRoeDl6MHNqc2puY3c0aW9iNWJ0eDhjZjE1N2JkNnF6aiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/WfaHuht7D5SSNfetTf/giphy.gif"
    ];

    // Pick a random GIF on site load instantly
    const initialGif = bgGifs[Math.floor(Math.random() * bgGifs.length)];
    const initialLayer = bgContainer.querySelector('.bg-layer');
    if (initialLayer) {
        initialLayer.style.backgroundImage = `url('${initialGif}')`;
    }

    let isBgChanging = false;

    bgTriggers.forEach(btn => {
        btn.addEventListener('click', () => {
            const url = btn.getAttribute('data-bg');
            if(!url || isBgChanging) return;

            const currentLayer = bgContainer.querySelector('.bg-layer');
            if (currentLayer && currentLayer.style.backgroundImage.includes(url)) return;

            isBgChanging = true;

            // Preload image
            const img = new Image();
            img.onload = () => {
                const tl = gsap.timeline({
                    onComplete: () => {
                        isBgChanging = false;
                    }
                });

                // 1. Fade out current layer to reveal the black #bg-container underneath
                if (currentLayer) {
                    tl.to(currentLayer, {
                        opacity: 0,
                        duration: 0.4,
                        ease: "power2.inOut"
                    });
                }

                // 2. Deliberate short pause on completely black background (~0.3 seconds)
                tl.to({}, { duration: 0.3 });

                // 3. Swap layer and fade in new GIF
                tl.add(() => {
                    if (currentLayer) currentLayer.remove();

                    const newLayer = document.createElement('div');
                    newLayer.className = 'bg-layer';
                    newLayer.style.backgroundImage = `url('${url}')`;
                    newLayer.style.opacity = 0;
                    bgContainer.appendChild(newLayer);

                    gsap.to(newLayer, {
                        opacity: 1,
                        duration: 0.5,
                        ease: "power2.inOut"
                    });
                });
            };
            img.src = url;
        });
    });
</script>

</body>
</html>
